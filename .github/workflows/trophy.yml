name: Generate Trophy SVG

on:
  schedule:
    - cron: "0 19 * * *" # daily 19:00 UTC = 03:00 Beijing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate trophy
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 -b feature/generate-svg \
            https://github.com/Erik-Donath/github-profile-trophy.git /tmp/trophy
          cd /tmp/trophy
          deno run --allow-net --allow-env --allow-read --allow-write \
            render_svg.ts Lion-1209 \
            --file "$GITHUB_WORKSPACE/assets/trophy.svg" \
            --theme radical \
            --rows 1 \
            --no-background \
            --no-frame

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          git diff --cached --quiet || git commit -m "chore: refresh trophy SVG"
          git push
