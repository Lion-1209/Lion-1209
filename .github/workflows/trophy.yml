name: Generate Trophy SVG

on:
  schedule:
    - cron: "0 19 * * *" # daily 19:00 UTC = 03:00 Beijing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: Lion-1209
          file: assets/trophy.svg
          theme: radical
          max-rows: "1"
          no-background: "true"
          no-frame: "true"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          git diff --cached --quiet || git commit -m "chore: refresh trophy SVG"
          git push
