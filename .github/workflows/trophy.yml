name: Generate Trophy SVG

on:
  schedule:
    - cron: "0 19 * * *" # daily 19:00 UTC = 03:00 Beijing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch trophy from mirror
        run: |
          mkdir -p assets
          for ep in \
            "https://trophygithubreadmelang.cybee.dpdns.org" \
            "https://trophy.benkou.dev" \
            "https://github-trophies.devomb.com"; do
            echo "Trying $ep ..."
            curl -sf --max-time 60 \
              "$ep/?username=Lion-1209&theme=radical&no-bg=true&no-border=true&row=1&column=6" \
              -o assets/trophy.svg && grep -q "<svg" assets/trophy.svg \
              && echo "OK from $ep" && break
            echo "Failed: $ep"
          done
          grep -q "<svg" assets/trophy.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          git diff --cached --quiet || git commit -m "chore: refresh trophy SVG"
          git push
