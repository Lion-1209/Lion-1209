name: Debug GraphQL
on: workflow_dispatch
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query GraphQL with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -w "\nHTTP:%{http_code}\n" https://api.github.com/graphql \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "User-Agent: trophy-test" \
            -d '{"query":"query{user(login:\"Lion-1209\"){login contributionsCollection{totalCommitContributions}}}", "variables":{}}' | head -20
